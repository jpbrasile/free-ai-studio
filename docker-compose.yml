services:
  sandbox-worker:
    build:
      context: ./sandbox-worker
    container_name: free-ai-studio-sandbox-worker
    restart: unless-stopped
    environment:
      SANDBOX_WORKER_KEY: ${SANDBOX_WORKER_KEY}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-120}
      SANDBOX_MAX_CODE_BYTES: ${SANDBOX_MAX_CODE_BYTES:-500000}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-200000}
    networks:
      - sandbox-internal
    volumes:
      - sandbox-data:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  sandbox-manager:
    build:
      context: ./sandbox-manager
    container_name: free-ai-studio-sandbox-manager
    restart: unless-stopped
    depends_on:
      sandbox-worker:
        condition: service_healthy
    environment:
      SANDBOX_MANAGER_KEY: ${SANDBOX_MANAGER_KEY}
      SANDBOX_WORKER_KEY: ${SANDBOX_WORKER_KEY}
      SANDBOX_WORKER_URL: http://sandbox-worker:8000
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-120}
      SANDBOX_MAX_CODE_BYTES: ${SANDBOX_MAX_CODE_BYTES:-500000}
      SANDBOX_MAX_ARTIFACT_BYTES: ${SANDBOX_MAX_ARTIFACT_BYTES:-104857600}
      # Modal = backend automatique principal lorsqu'il est explicitement configuré.
      MODAL_ENABLED: ${MODAL_ENABLED:-false}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_APP_NAME: ${MODAL_APP_NAME:-free-ai-studio-sandbox}
      MODAL_JOB_TIMEOUT_SECONDS: ${MODAL_JOB_TIMEOUT_SECONDS:-300}
      MODAL_IDLE_TIMEOUT_SECONDS: ${MODAL_IDLE_TIMEOUT_SECONDS:-60}
      MODAL_CLEANUP_GRACE_SECONDS: ${MODAL_CLEANUP_GRACE_SECONDS:-60}
      MODAL_CPU: ${MODAL_CPU:-1.0}
      MODAL_MEMORY_MB: ${MODAL_MEMORY_MB:-2048}
      MODAL_GPU_DEFAULT: ${MODAL_GPU_DEFAULT:-T4}
      KAGGLE_ENABLED: ${KAGGLE_ENABLED:-false}
      KAGGLE_JOB_TIMEOUT_SECONDS: ${KAGGLE_JOB_TIMEOUT_SECONDS:-3600}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      COLAB_API_ENABLED: ${COLAB_API_ENABLED:-false}
      # Kaggle automatique n'est permis qu'au proprietaire des identifiants, sur
      # sa machine. Ces deux reglages le coupent quand le Studio sert d'autres
      # personnes (voir docs/GPU_CLOUD.md).
      STUDIO_HEBERGE: ${STUDIO_HEBERGE:-false}
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      # Video : seule fonction du Studio qui loue une carte graphique a la
      # minute. Le plafond est un refus AVANT de lancer, pas un constat apres
      # coup ; le compteur du mois vit dans config/video-budget.json.
      VIDEO_BUDGET_USD_PAR_MOIS: ${VIDEO_BUDGET_USD_PAR_MOIS:-20}
      MODAL_CREDIT_MENSUEL_USD: ${MODAL_CREDIT_MENSUEL_USD:-30}
      VIDEO_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-2400}
      VIDEO_GPU_RAPIDE: ${VIDEO_GPU_RAPIDE:-L4}
      VIDEO_GPU_SOIGNE: ${VIDEO_GPU_SOIGNE:-A100}
      VIDEO_MEMORY_MB: ${VIDEO_MEMORY_MB:-16384}
      VIDEO_MODAL_VOLUME: ${VIDEO_MODAL_VOLUME:-free-ai-studio-modeles}
    ports:
      - "127.0.0.1:8020:8000"
    networks:
      - default
      - sandbox-internal
    volumes:
      - sandbox-data:/workspace
      # Identifiants Modal / Kaggle saisis depuis la page /cles du Sandbox.
      # Meme raison que pour le routeur de chat : les variables du compose sont
      # figees a la creation du conteneur. Exclu du depot par .gitignore.
      - ./config:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  free-tier-manager:
    build:
      context: ./free-tier-manager
    container_name: free-ai-studio-manager
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      # Cles saisies depuis la page /cles. env_file etant evalue a la creation du
      # conteneur, une cle ajoutee dans .env n'agit pas a chaud : ce repertoire
      # permet a l'interface de brancher un fournisseur sans terminal. Il est
      # exclu du depot par .gitignore.
      - ./config:/config
      # LECTURE SEULE, et seulement .git : de quoi lire le numero de version
      # installe pour le comparer a celui de GitHub. Ni le code, ni .env ne sont
      # exposes, et rien ici ne peut ecrire dans le depot.
      - ./.git:/depot/.git:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: free-ai-studio-open-webui
    restart: unless-stopped
    depends_on:
      free-tier-manager:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://free-tier-manager:8000/v1
      OPENAI_API_KEY: ${FREE_TIER_MANAGER_KEY}
      # Le port n'est publie que sur 127.0.0.1 : la porte est deja fermee au reseau.
      # Exiger en plus un compte avec e-mail et mot de passe pour utiliser une appli
      # posee sur son propre ordinateur arrete le debutant des le premier ecran, en
      # anglais, sans rien proteger de plus. Mettre WEBUI_AUTH=true retablit le compte
      # (utile si plusieurs personnes partagent la machine) -- a faire AVANT le premier
      # demarrage, Open WebUI refusant de basculer une base qui contient deja un compte.
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      WEBUI_NAME: ${WEBUI_NAME:-Free AI Studio}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-fr}
      # Recherche web : DuckDuckGo ne demande aucune cle et aucun compte.
      # ATTENTION : ces deux variables ne sont lues qu'au TOUT PREMIER demarrage.
      # Ensuite Open WebUI ne lit plus que sa propre base, et le fait sans le
      # dire : mesure du 09/09, la variable etait bien dans le conteneur et le
      # reglage valait quand meme false. C'est le routeur qui pose le reglage
      # par l'API d'administration, une seule fois (voir poser_reglages_webui).
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      WEB_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-duckduckgo}
      # << Arena Model >> tire au sort entre les modeles et demande un vote : un
      # choix d'Open WebUI, pas du Studio, et incomprehensible pour un debutant.
      # Meme regle : lue au tout premier demarrage seulement ; pour une base
      # existante, c'est le routeur qui coupe le reglage (voir masquer_arena).
      ENABLE_EVALUATION_ARENA_MODELS: "false"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
  sandbox-data:

networks:
  sandbox-internal:
    internal: true
