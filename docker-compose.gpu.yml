# Surcouche GPU : appliquee SEULEMENT si une carte est vue sur la machine.
#
# Elle n'est pas dans docker-compose.yml, et c'est delibere : une reservation
# `driver: nvidia` sur une machine sans carte fait ECHOUER `docker compose up`.
# Le debutant sans carte -- le cas le plus courant -- ne doit jamais rencontrer
# ce message. `scripts/demarrer.ps1` regarde d'abord si la machine a une carte,
# et n'ajoute ce fichier que dans ce cas.
#
# Mesure le 19/09/2026 sur cette machine : `docker run --rm --gpus all
# python:3.12-slim nvidia-smi` rend << NVIDIA GeForce RTX 4090, 24138 MiB >>.
# Le passage de la carte par WSL2 fonctionne donc DEJA, sans image CUDA et sans
# rien installer : c'est le morceau repute penible, et il etait deja en place.
#
# Ce que cette surcouche donne : la carte est VISIBLE au service qui decide
# (mesure de la memoire libre par nvidia-smi, que le runtime injecte), ET un
# deuxieme bac a sable qui sait s'en servir -- `sandbox-worker-gpu`, ajoute en
# phase 3 le 19/09/2026. Tout le detail : docs/GPU-LOCAL.md.
#
# Usage : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# `scripts/demarrer.ps1` le fait tout seul quand une carte repond.
services:
  sandbox-manager:
    environment:
      GPU_LOCAL_ACTIF: "${GPU_LOCAL_ACTIF:-true}"
      SANDBOX_WORKER_GPU_URL: http://sandbox-worker-gpu:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Le bac a sable de la maison. Meme code que celui sur processeur, meme
  # volume /workspace (le gestionnaire y relit le clip), meme cloison reseau.
  sandbox-worker-gpu:
    build:
      # La racine, pour copier sandbox-worker/app.py sans le dupliquer.
      context: .
      dockerfile: sandbox-worker-gpu/Dockerfile
    container_name: free-ai-studio-sandbox-worker-gpu
    restart: unless-stopped
    environment:
      SANDBOX_WORKER_KEY: ${SANDBOX_WORKER_KEY}
      # Un clip de 3 s a pris 412 s de calcul le 19/09, plus 24 s de chargement.
      # 2400 s couvre le premier lancement, telechargement du modele compris.
      SANDBOX_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-2400}
      SANDBOX_MAX_CODE_BYTES: ${SANDBOX_MAX_CODE_BYTES:-500000}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-200000}
      # Sans ces variables-la, le script ne trouve pas la carte -- le runtime
      # NVIDIA les pose dans le conteneur, et le worker construit un
      # environnement nu -- et il retelechargerait 34 Go a chaque clip.
      SANDBOX_ENV_PASSTHROUGH: "LD_LIBRARY_PATH,NVIDIA_VISIBLE_DEVICES,NVIDIA_DRIVER_CAPABILITIES,CUDA_VISIBLE_DEVICES,HF_HOME,HF_HUB_DISABLE_XET,HF_HUB_OFFLINE"
      HF_HOME: /cache/huggingface
      # Ce bac a sable est sur un reseau SANS internet (`internal: true`), comme
      # celui sur processeur. Sans cette ligne, `diffusers` demande quand meme
      # a Hugging Face si les poids ont change, echoue sur la resolution de nom,
      # et RECOMMENCE cinq fois : mesure du 19/09 au premier clip passe par la
      # pile -- environ quarante secondes perdues par clip, et vingt lignes de
      # rouge dans le journal d'un debutant pour un clip qui va reussir.
      # Coupe, il lit directement le cache local.
      HF_HUB_OFFLINE: "1"
      # Mesure du 19/09 : la couche de transfert << Xet >> de huggingface_hub
      # 1.9.2 s'est bloquee treize minutes sans ecrire un octet, a 14 067 Mo sur
      # 34 200. Coupee, les memes fichiers sont descendus en quatre-vingts
      # secondes. Ce n'est pas une precaution de style.
      HF_HUB_DISABLE_XET: "1"
      # Ce que ce bac a sable doit AVOIR pour servir a quelque chose. /health le
      # rapporte, et le gestionnaire route ailleurs -- AVANT de lancer -- si les
      # poids manquent, au lieu de laisser un clip echouer dix minutes plus tard.
      SANDBOX_POIDS_REQUIS: /cache/huggingface/hub/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
    # Le meme reseau clos que le bac a sable sur processeur. C'est un CHOIX,
    # pas une loi de Docker, et il se defait en une ligne (`- default`). La
    # mesure du 19/09 depuis CE conteneur : `gethostbyname('huggingface.co')`
    # rend << Temporary failure in name resolution >>, parce que
    # `sandbox-internal` porte `internal: true` dans docker-compose.yml.
    # Ce que l'ouvrir ne reglerait PAS : les 34 Go ont demande environ une heure
    # le 19/09 et un travail est coupe a 2 400 s -- le premier clip expirerait
    # avant la fin du telechargement. Le prechargement
    # (scripts/telecharger-modele-video.ps1) est donc necessaire dans les deux
    # cas, et le reseau clos reste le defaut tant que rien ne le paie.
    networks:
      - sandbox-internal
    volumes:
      - sandbox-data:/workspace
      # Les 34 Go de poids, telecharges une fois par
      # scripts/telecharger-modele-video.ps1 (ou son jumeau .sh).
      #
      # Le defaut etait `modeles-gpu`, un volume Docker VIDE, et seul
      # `scripts/demarrer.ps1` posait GPU_MODELES_DIR sur le cache du profil.
      # MESURE le 19/09 au soir : un `docker compose up -d sandbox-worker-gpu`
      # tape a la main, dans un shell ou la variable n'est pas posee, remonte le
      # volume vide EN SILENCE -- le Studio repond alors << les 34 Go ne sont pas
      # telecharges >> alors qu'ils sont sur le disque, et un debutant
      # retelecharge une heure pour rien. Le defaut est donc le cache du profil
      # lui-meme : n'importe quel shell, Windows ou Linux, le resout.
      - ${GPU_MODELES_DIR:-${USERPROFILE:-${HOME:-.}}/.cache/huggingface}:/cache/huggingface
    # PAS de `read_only` ici, contrairement au bac a sable sur processeur : le
    # cache des modeles s'ecrit, et les bibliotheques CUDA posent leurs fichiers
    # de compilation. Tout le reste du cloisonnement est garde, y compris le
    # reseau interne et le compte non privilegie.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # Plus personne ne le monte par defaut depuis le 19/09 (voir le commentaire du
  # montage /cache/huggingface). Il reste declare pour qui pose
  # GPU_MODELES_DIR=modeles-gpu a la main -- par exemple pour garder les poids
  # hors du profil. Le script de telechargement suit la meme regle que ce
  # fichier : les deux doivent viser le meme dossier, sinon les 34 Go
  # atterrissent la ou personne ne les lit.
  modeles-gpu:
