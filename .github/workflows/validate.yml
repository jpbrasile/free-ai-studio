name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Meme version que les conteneurs (python:3.12-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TOUS les fichiers Python suivis par git, et non une liste ecrite a la
      # main : un fichier ajoute demain est controle sans que personne pense a
      # l'inscrire ici. L'ancienne liste n'en couvrait qu'un sur six.
      - name: Python syntax (every tracked .py file)
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      # py_compile ne voit ni un nom non defini dans une branche rarement
      # prise, ni un import mort. ruff les voit sans rien executer.
      # Regles : ruff.toml.
      - name: Lint (ruff)
        run: |
          python -m pip install --quiet ruff==0.16.7
          ruff check .

      - name: Install service dependencies
        run: |
          python -m pip install --quiet \
            -r free-tier-manager/requirements.txt \
            -r sandbox-manager/requirements.txt \
            -r sandbox-worker/requirements.txt \
            pytest==9.1.1

      # Charge chaque service comme son conteneur le fait au demarrage : une
      # dependance manquante ou une erreur au chargement casse ici, pas chez le
      # debutant apres dix minutes de construction Docker.
      - name: Import every FastAPI service
        run: python scripts/verifier-imports.py

      # Les pages HTML sont des chaines Python : un \n mal echappe y casse TOUT
      # le JavaScript de la page, sans la moindre erreur cote Python. /studio
      # est reste ainsi du commit ed3e71d au 11/09/2026.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax of the service pages
        run: python scripts/verifier-js.py

      - name: Tests
        run: python -m pytest -q tests

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n start.sh
          bash -n scripts/diagnose.sh
          bash -n scripts/check-providers.sh
          bash -n scripts/check-assistant-capabilities.sh
          bash -n scripts/free-tier-status.sh
          bash -n scripts/configure-beginner.sh
          bash -n scripts/check-modal.sh

      - name: Verify free-only defaults
        run: |
          grep -q '^FREE_ONLY=true$' .env.example
          grep -q '^ALLOW_PAID_MODELS=false$' .env.example
          grep -q '^ALLOW_PAID_GPU=false$' .env.example
          grep -q '^MAX_DAILY_COST=0$' .env.example

      # Le compose lit aussi .env (env_file), qui n'est jamais dans le depot. Sur
      # le runner, on en pose une copie de .env.example, sans aucun secret.
      # Premier passage reel sur GitHub, le 11/09/2026 : sans cette copie,
      # l'etape echouait (<< env file .env not found >>) ; en local, le vrai
      # .env masquait le defaut.
      - name: Docker Compose config
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config >/dev/null
